services:
  db:
    image: postgres:17-alpine
    container_name: speedai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: speedai
      POSTGRES_PASSWORD: speedai_dev
      POSTGRES_DB: speed_ai
    ports:
      - "5433:5432"
    volumes:
      - speedai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speedai -d speed_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speedai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://speedai:speedai_dev@db:5432/speed_ai?schema=public
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && npm start"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: speedai-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      VITE_API_PROXY_TARGET: http://backend:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  speedai-postgres-data:
    name: speedai-postgres-data
  frontend-node-modules:

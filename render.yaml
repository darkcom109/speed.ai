services:
  - type: web
    name: speed-ai
    runtime: node
    plan: 0.5c-512mb
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci && npx prisma generate
    startCommand: cd backend && npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: speed-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: TFL_APP_KEY
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: RESEARCH_FETCH_TIMEOUT_MS
        value: "12000"

databases:
  - name: speed-ai-db
    plan: basic-256mb
    databaseName: speed_ai
    user: speed_ai
